spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_companion
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080